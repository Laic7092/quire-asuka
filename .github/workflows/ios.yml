name: iOS IPA

# An UNSIGNED device .ipa, built on a macOS runner with no Apple developer
# account: a throwaway self-signed identity and stub profile get asuka through
# its signing step, then the signature is stripped. Install it with Sideloadly
# or AltStore (a free Apple ID re-signs it, 7 days at a time), on a jailbroken
# device, or with TrollStore on iOS 17.0 and older.
#
# The build needs Xcode 26 or newer, which is what asuka compiles against.
#
# Two jobs, in parallel: the tests run where they're cheap (a Linux runner, on
# the engine's Linux build), and the Mac runner only does what needs Xcode — one
# engine build (the device's), and the .ipa. Add `needs: test` to the `ipa` job
# to gate the artifact on the tests, at the cost of running them in sequence.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push on the same branch cancels the run before it: a macOS runner is
# the expensive part.
concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The book engine is its own Rust repository: format, layout, the page
      # rasterizer. A private one needs a token that can read it, in
      # secrets.ENGINE_TOKEN; a public one needs nothing.
      - uses: actions/checkout@v4
        with:
          repository: Laic7092/ebook-engine
          path: ebook-engine
          token: ${{ secrets.ENGINE_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ebook-engine

      # The tests link the engine, so they need it for their own machine.
      - name: Build the engine
        run: bash .github/scripts/build-engine.sh linux-x64 ebook-engine

      - name: Install the asuka CLI
        run: |
          curl -fsSL https://asuka.egoist.dev/install.sh | sh
          echo "$HOME/.asuka/bin" >> "$GITHUB_PATH"

      - name: Check and test
        run: |
          asuka version
          asuka check
          asuka test

  ipa:
    name: Unsigned IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Laic7092/ebook-engine
          path: ebook-engine
          token: ${{ secrets.ENGINE_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ebook-engine

      - name: Xcode
        run: |
          # macos-latest carries several Xcodes; asuka needs 26+, and the one
          # picked must have a simulator runtime matching its iOS SDK, or
          # actool (the app icon) fails: the newest is the one the image's
          # runtimes were installed for.
          apps=(/Applications/Xcode_26*.app)
          if [ -e "${apps[0]}" ]; then
            latest="$(printf '%s\n' "${apps[@]}" | sort -V | tail -1)"
            echo "using $latest"
            sudo xcode-select -s "$latest"
          fi
          xcodebuild -version
          xcrun simctl list runtimes | head -8
          major="$(xcodebuild -version | sed -n 's/^Xcode \([0-9]*\).*/\1/p')"
          if [ "${major:-0}" -lt 26 ]; then
            echo "::error::asuka needs Xcode 26 or newer; this image has ${major:-none}. Use a runner image with it (runs-on: macos-26, when the label exists)."
            exit 1
          fi
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install the asuka CLI
        run: |
          curl -fsSL https://asuka.egoist.dev/install.sh | sh
          echo "$HOME/.asuka/bin" >> "$GITHUB_PATH"

      # The device's build only: a simulator's library is built by whoever
      # builds for a simulator, not here.
      - name: Build the engine for the device
        run: bash .github/scripts/build-engine.sh ios-arm64 ebook-engine

      - name: Check
        run: |
          asuka version
          asuka check

      - name: Build the unsigned IPA
        run: bash .github/scripts/build-unsigned-ipa.sh

      # GitHub's artifact service times out now and then ("Failed to
      # CreateArtifact"): one more try, and the job says so if both fail.
      - id: upload
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ios-unsigned-ipa
          path: dist/*-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: steps.upload.outcome == 'failure'
        with:
          name: ios-unsigned-ipa
          path: dist/*-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
