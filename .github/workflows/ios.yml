name: iOS IPA

# An UNSIGNED device .ipa, built on a macOS runner with no Apple developer
# account: a throwaway self-signed identity and stub profile get asuka through
# its signing step, then the signature is stripped. Install it with Sideloadly
# or AltStore (a free Apple ID re-signs it, 7 days at a time), on a jailbroken
# device, or with TrollStore on iOS 17.0 and older.
#
# The build needs Xcode 26 or newer, which is what asuka compiles against.
#
# Nothing here builds the engines: ebook-engine and legado-engine are released
# with one static library per target, and both jobs download theirs — no Rust
# toolchain, no cargo cache, no compile. ENGINE_VERSION and LEGADO_VERSION are
# the releases this app is written against (see "引擎" in README.md).
#
# Two jobs, in parallel: the tests run where they're cheap (a Linux runner, on
# the engine's Linux build), and the Mac runner only does what needs Xcode.
# Add `needs: test` to the `ipa` job to gate the artifact on the tests, at the
# cost of running them in sequence.

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Docs don't change the app or its engine: a README edit doesn't need a
    # macOS runner. (Workflow changes themselves still run.)
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

env:
  # The engine releases to build against: github.com/Laic7092/ebook-engine and
  # github.com/Laic7092/legado-engine. `latest` follows the newest
  # non-prerelease; a tag pins one.
  ENGINE_VERSION: v0.5.1
  LEGADO_VERSION: v0.3.0

# A newer push on the same branch cancels the run before it: a macOS runner is
# the expensive part.
concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # reader.asuka embeds the font, and the repository doesn't carry it:
      # the script downloads the pinned WOFF.
      - name: Fetch the font
        run: bash .github/scripts/fetch-font.sh

      # The tests link the engines, so they need them for their own machine.
      - name: Fetch the engines
        run: |
          bash .github/scripts/fetch-engine.sh linux-x64
          bash .github/scripts/fetch-legado.sh linux-x64

      # Asuka's prebuilt libraries and the C it compiles: the same between
      # runs, so the test step doesn't download and build them again.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/asuka
          key: asuka-${{ runner.os }}-${{ hashFiles('asuka.lock') }}
          restore-keys: asuka-${{ runner.os }}-

      - name: Install the asuka CLI
        run: |
          curl -fsSL https://asuka.egoist.dev/install.sh | sh
          echo "$HOME/.asuka/bin" >> "$GITHUB_PATH"

      - name: Check and test
        run: |
          asuka version
          asuka check
          # The app's tests, and the lib package's (parser and page turn):
          # `asuka test` runs the tests of the package in the directory it's
          # given, and lib/ is one of its own.
          asuka test
          asuka test lib

  ipa:
    name: Unsigned IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # reader.asuka embeds the font, and the repository doesn't carry it:
      # the script downloads the pinned WOFF.
      - name: Fetch the font
        run: bash .github/scripts/fetch-font.sh

      # The device's libraries only: a simulator's are for whoever builds for
      # one (legado-engine doesn't release a simulator slice, and c/legado.c
      # compiles its calls out there).
      - name: Fetch the engines
        run: |
          bash .github/scripts/fetch-engine.sh ios-arm64
          bash .github/scripts/fetch-legado.sh ios-arm64

      - name: Xcode
        run: |
          # macos-latest carries several Xcodes; asuka needs 26+, and the one
          # picked must have a simulator runtime matching its iOS SDK, or
          # actool (the app icon) fails: the newest is the one the image's
          # runtimes were installed for.
          apps=(/Applications/Xcode_26*.app)
          if [ -e "${apps[0]}" ]; then
            latest="$(printf '%s\n' "${apps[@]}" | sort -V | tail -1)"
            echo "using $latest"
            sudo xcode-select -s "$latest"
          fi
          xcodebuild -version
          xcrun simctl list runtimes | head -8
          major="$(xcodebuild -version | sed -n 's/^Xcode \([0-9]*\).*/\1/p')"
          if [ "${major:-0}" -lt 26 ]; then
            echo "::error::asuka needs Xcode 26 or newer; this image has ${major:-none}. Use a runner image with it (runs-on: macos-26, when the label exists)."
            exit 1
          fi
          xcrun --sdk iphoneos --show-sdk-version

      - uses: actions/cache@v6
        with:
          path: ~/.cache/asuka
          key: asuka-${{ runner.os }}-${{ hashFiles('asuka.lock') }}
          restore-keys: asuka-${{ runner.os }}-

      - name: Install the asuka CLI
        run: |
          curl -fsSL https://asuka.egoist.dev/install.sh | sh
          echo "$HOME/.asuka/bin" >> "$GITHUB_PATH"

      - name: Check
        run: |
          asuka version
          asuka check

      - name: Build the unsigned IPA
        run: bash .github/scripts/build-unsigned-ipa.sh

      # GitHub's artifact service times out now and then ("Failed to
      # CreateArtifact"): one more try, and the job says so if both fail.
      - id: upload
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: ios-unsigned-ipa
          path: dist/*-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v6
        if: steps.upload.outcome == 'failure'
        with:
          name: ios-unsigned-ipa
          path: dist/*-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
