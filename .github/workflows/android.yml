name: Android

# The app for Android: `asuka build -p android` writes an .aab, the package
# Google Play takes, signed with the upload key (ASUKA_KEYSTORE and the rest
# of the environment, or a throwaway one here so the artifact exists).
#
# The runner has the SDK, the NDK and a JDK; the engine comes from the same
# release as the iOS one, its Android targets.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The engine release to build against: github.com/Laic7092/ebook-engine.
  ENGINE_VERSION: v0.6.0

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Gradle downloads AGP and Kotlin from Maven each run, and asuka
      # downloads its own host for each ABI: both are the build's minutes.
      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/cache@v4
        with:
          path: ~/.cache/asuka
          key: asuka-hosts-${{ runner.os }}-v1

      # reader.asuka embeds the font, and the repository doesn't carry it:
      # the script downloads the pinned WOFF.
      - name: Fetch the font
        run: bash .github/scripts/fetch-font.sh

      # The target's libraries, not this runner's: it's the Android app, for
      # the ABIs asuka builds (arm64-v8a and x86_64 for emulators, armeabi-v7a
      # for older phones).
      - name: Fetch the engines
        run: |
          bash .github/scripts/fetch-engine.sh android-arm android-arm64 android-x64
          bash .github/scripts/fetch-legado.sh android-arm android-arm64 android-x64

      - name: Install the asuka CLI
        run: |
          curl -fsSL https://asuka.egoist.dev/install.sh | sh
          echo "$HOME/.asuka/bin" >> "$GITHUB_PATH"

      # A throwaway upload key, so the .aab is signed and the artifact is
      # usable at once: a release of the app's own keeps its key in secrets.
      - name: Upload key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/upload.jks" -storepass quireupload -keypass quireupload \
            -alias quire -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Quire, O=Quire, C=US"
          {
            echo "ASUKA_KEYSTORE=$RUNNER_TEMP/upload.jks"
            echo "ASUKA_KEYSTORE_PASSWORD=quireupload"
            echo "ASUKA_KEY_ALIAS=quire"
            echo "ASUKA_KEY_PASSWORD=quireupload"
          } >> "$GITHUB_ENV"

      - name: Check
        run: |
          java -version
          asuka version
          asuka check -p android

      - name: Build
        run: asuka build -p android

      # The .aab is what Play takes; a phone takes an .apk. bundletool makes
      # one for the device it's asked about — arm64 here, which is every phone
      # that matters: a universal .apk carries all three ABIs and is ~100 MB
      # for nothing.
      - name: APK
        run: |
          version=1.17.2
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/$version/bundletool-all-$version.jar"
          cat > "$RUNNER_TEMP/arm64.json" <<'JSON'
          {
            "supportedAbis": ["arm64-v8a"],
            "supportedLocales": ["zh", "en"],
            "screenDensity": 420,
            "sdkVersion": 34
          }
          JSON
          aab="$(ls dist/*.aab | head -1)"
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks \
            --bundle="$aab" --output="$RUNNER_TEMP/quire.apks" \
            --device-spec="$RUNNER_TEMP/arm64.json" \
            --ks="$ASUKA_KEYSTORE" --ks-key-alias="$ASUKA_KEY_ALIAS" \
            --ks-pass="pass:$ASUKA_KEYSTORE_PASSWORD" --key-pass="pass:$ASUKA_KEY_PASSWORD"
          unzip -o -q "$RUNNER_TEMP/quire.apks" -d "$RUNNER_TEMP/apks"
          cp "$RUNNER_TEMP/apks/"*arm64-v8a*.apk "dist/$(basename "${aab%.aab}").apk"
          ls -la dist

      - uses: actions/upload-artifact@v6
        with:
          name: android
          path: |
            dist/*.aab
            dist/*.apk
          if-no-files-found: error
          retention-days: 14
