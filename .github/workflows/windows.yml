name: Windows

# A Windows build of the app, from Linux with Zig: asuka compiles the Asuka
# to C, links ebook-engine's Windows library, and writes dist/windows-amd64/ —
# the .exe with its icon and version, its assets, and the .zip around them.
#
# Shipping says a Windows app builds "on Windows with clang, or any system
# with Zig", and one Ubuntu runner is the cheaper of the two. The font and
# the engine come from the same scripts as the iOS workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Docs don't change the app or its engine: a README edit doesn't need a
    # runner. (Workflow changes themselves still run.)
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

env:
  # The engine release to build against: github.com/Laic7092/ebook-engine.
  # `latest` follows the newest non-prerelease; a tag pins one.
  ENGINE_VERSION: latest

# A newer push on the same branch cancels the run before it.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Zig's release, fetched here rather than with setup-zig: the runner's
      # actions run on Node 24 now, and a Node 20 action would put the
      # deprecation warning back.
      - name: Install Zig
        run: |
          version=0.14.1
          curl -fsSL -o "$RUNNER_TEMP/zig.tar.xz" \
            "https://ziglang.org/download/$version/zig-x86_64-linux-$version.tar.xz"
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-$version" >> "$GITHUB_PATH"

      # reader.asuka embeds the font, and the repository doesn't carry it:
      # the script downloads the pinned WOFF.
      - name: Fetch the font
        run: bash .github/scripts/fetch-font.sh

      # The target's library, not this runner's: it's the Windows app.
      - name: Fetch the engine
        run: bash .github/scripts/fetch-engine.sh windows-x64

      - name: Install the asuka CLI
        run: |
          curl -fsSL https://asuka.egoist.dev/install.sh | sh
          echo "$HOME/.asuka/bin" >> "$GITHUB_PATH"

      - name: Check
        run: |
          zig version
          asuka version
          asuka check -p windows

      - name: Build
        run: asuka build -p windows --arch amd64

      - uses: actions/upload-artifact@v6
        with:
          name: windows-amd64
          path: dist/windows-amd64/*.zip
          if-no-files-found: error
          retention-days: 14
