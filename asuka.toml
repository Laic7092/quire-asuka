# Quire: a reader for plain text and (soon) EPUB, written in Asuka so the
# views are each platform's own — the iOS build is the one this targets.

name = "Quire"
id = "dev.laix.quire"
version = "0.1"
build = 1
icon = "icon.png"
orientations = ["portrait", "landscape"]

# What the app opens: a .txt handed over by Files, Mail, or another app.
[[fileTypes]]
name = "Plain Text"
extensions = ["txt"]
role = "viewer"
conformsTo = ["public.plain-text", "public.text"]

[[fileTypes]]
name = "EPUB"
extensions = ["epub"]
role = "viewer"
conformsTo = ["org.idpf.epub-container", "public.data"]

[splash]
background = "#fbfaf7"
darkBackground = "#16161a"

[ios]
# team = "ABCDE12345"          # your Apple Developer team, for the .ipa
# profile = "Quire Distribution"  # else the best match in the keychain
iphoneOnly = false
nonExemptEncryption = "no"

# The book engine (github.com/Laic7092/ebook-engine): Rust, a static
# library per target. Format, layout and the page rasterizer are its;
# this app only calls its C ABI and shows the pages.
[dependencies]
bookpage = "file:bookpage"

[c]
# legado-engine's C ABI (c/legado.c), and swprintf/swscanf for asuka's own
# Windows host (c/windows-legacy-stdio.c).
sources = ["c/*.c"]

[c.prebuilt]
# legado-engine (the online book sources' rules and JavaScript) is the second
# library where it's built. The iOS simulator, Windows, Android and the web
# have no build of it here: c/legado.c then compiles its calls as answers
# saying so, and book sources say they aren't available on that platform.
linux-x64 = ["lib/linux-x64/libebook_abi.a", "lib/linux-x64/liblegado_engine.a"]
macos-arm64 = ["lib/macos-arm64/libebook_abi.a", "lib/macos-arm64/liblegado_engine.a"]
macos-x64 = ["lib/macos-x64/libebook_abi.a", "lib/macos-x64/liblegado_engine.a"]
ios-arm64 = ["lib/ios-arm64/libebook_abi.a", "lib/ios-arm64/liblegado_engine.a"]
ios-simulator-arm64 = "lib/ios-simulator-arm64/libebook_abi.a"
ios-simulator-x64 = "lib/ios-simulator-x64/libebook_abi.a"
# Built for mingw (x86_64-pc-windows-gnu), the target asuka's Windows
# build links with (see the note below); the release's is MSVC's .lib.
windows-x64 = "lib/windows-x64/libebook_abi.a"

# legado-engine's time zone comes from CoreFoundation on Apple (chrono's
# iana-time-zone), so the app links it on both Apple targets.
[c.ios]
frameworks = ["CoreFoundation"]

[c.macos]
frameworks = ["CoreFoundation"]

# Rust's std needs these on the desktops; Apple's SDK brings its own.
[c.linux]
libraries = ["pthread", "dl", "m"]

# The engine is Rust, so its std pays for Windows' own: the host links
# kernel32 and the GUI's libraries already. Rust's std also unwinds through
# libgcc's, which Zig has as libunwind (_Unwind_*, _GCC_specific_handler),
# and the host prints wide with swprintf, which here is the UCRT's.
[c.windows]
libraries = [
  "bcrypt",
  "ntdll",
  "userenv",
  "ws2_32",
  "unwind",
  # swprintf/swscanf (UCRT) and the ones Rust's std waits with. Zig builds
  # mingw's import libraries, whose names are the API set's.
  "api-ms-win-crt-stdio-l1-1-0",
  "api-ms-win-core-synch-l1-2-0",
]

[c.android]
libraries = ["dl", "log", "m"]
